
input {
  kafka {
    bootstrap_servers => "localhost:9092"
    topics => ["topic2"]
    group_id => "entity-logstash"
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  mutate {
    convert => { "count" => "integer" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "hackernews-entities"
    document_id => "%{entity}"
    action => "index"
  }

  stdout {
    codec => rubydebug
  }
}
